name: Visual preview
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Void
        run: docker build --pull -t void-visual:ci .
      - name: Start isolated preview
        run: |
          mkdir -p "$RUNNER_TEMP/void-visual-data"
          docker run -d --name void-visual -p 18080:8080 -e COOKIE_SECURE=0 -e ABYSS_TEST_MODE=1 -e BASE_URL=http://127.0.0.1:18080 -v "$RUNNER_TEMP/void-visual-data:/data" void-visual:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health | grep -q '"xray":"running"'; then exit 0; fi
            sleep 1
          done
          docker logs void-visual
          exit 1
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture desktop and mobile panel
        run: |
          mkdir -p visual-preview
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          base = "http://127.0.0.1:18080"
          out = Path("visual-preview")
          errors = []
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 1000}, device_scale_factor=1)
              page.on("pageerror", lambda e: errors.append(str(e)))
              page.goto(base + "/login", wait_until="domcontentloaded")
              page.wait_for_selector(".login-layout", timeout=10000)
              page.screenshot(path=str(out / "01-login-desktop.png"), full_page=False, animations="disabled")
              page.locator('input[name="username"]').fill("admin")
              page.locator('input[name="password"]').fill("admin")
              page.locator("form button").last.click()
              page.wait_for_function(
                  "() => location.pathname === '/' && !!document.querySelector('.app-shell')",
                  timeout=10000,
              )
              page.wait_for_timeout(500)
              desktop = page.evaluate("""() => ({
                viewport: innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                appShell: !!document.querySelector('.app-shell'),
                title: document.title
              })""")
              print("DESKTOP_PANEL=" + repr(desktop))
              if desktop["documentWidth"] > desktop["viewport"] + 1 or not desktop["appShell"]:
                  raise SystemExit("Desktop panel layout check failed: " + repr(desktop))
              page.screenshot(path=str(out / "02-dashboard-desktop.png"), full_page=False, animations="disabled")
              page.set_viewport_size({"width": 390, "height": 844})
              page.wait_for_timeout(300)
              mobile = page.evaluate("""() => ({
                viewport: innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                appShell: !!document.querySelector('.app-shell')
              })""")
              print("MOBILE_PANEL=" + repr(mobile))
              if mobile["documentWidth"] > mobile["viewport"] + 1 or not mobile["appShell"]:
                  raise SystemExit("Mobile panel layout check failed: " + repr(mobile))
              page.screenshot(path=str(out / "03-dashboard-mobile.png"), full_page=False, animations="disabled")
              if errors:
                  raise SystemExit("Browser JavaScript errors: " + repr(errors))
              browser.close()
          PY
      - name: Upload visual preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: void-panel-visual-preview
          path: visual-preview/
          if-no-files-found: warn
