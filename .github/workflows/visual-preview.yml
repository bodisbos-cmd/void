name: Visual preview
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Void
        run: docker build --pull -t void-visual:ci .
      - name: Start isolated preview
        run: |
          mkdir -p "$RUNNER_TEMP/void-visual-data"
          docker run -d --name void-visual -p 18080:8080 -e COOKIE_SECURE=0 -e ABYSS_TEST_MODE=1 -e BASE_URL=http://127.0.0.1:18080 -v "$RUNNER_TEMP/void-visual-data:/data" void-visual:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health | grep -q '"xray":"running"'; then exit 0; fi
            sleep 1
          done
          docker logs void-visual
          exit 1
      - name: Seed synthetic data for visual review only
        run: |
          docker exec -i void-visual python - <<'PY'
          import json, secrets, sqlite3, uuid
          from datetime import datetime, timedelta, timezone
          db = sqlite3.connect("/data/panel.sqlite3")
          now = datetime.now(timezone.utc)
          fixtures = [
              ("user123", 30, 100, 45.2),
              ("samira", 22, 50, 18.4),
              ("ali", 18, 30, 12.7),
              ("mohammad", 12, 20, 6.1),
              ("night", 8, 10, 3.6),
              ("reza", 3, 5, 1.2),
          ]
          for i, (name, days, quota_gb, used_gb) in enumerate(fixtures):
              created = (now - timedelta(days=i)).isoformat(timespec="seconds")
              expires = (now + timedelta(days=days)).isoformat(timespec="seconds")
              db.execute(
                  "INSERT INTO clients(id,name,client_uuid,sub_token,enabled,created_at,note,expires_at,quota_bytes,used_bytes,profile_keys,owner_id) VALUES(?,?,?,?,1,?,?,?,?,?,?,NULL)",
                  (f"visual-{i+1:02d}", name, str(uuid.uuid4()), ("preview-visual-token-0001" if i == 0 else secrets.token_urlsafe(24)), created,
                   "Visual preview fixture", expires, quota_gb * 1024**3, int(used_gb * 1024**3),
                   json.dumps(["ws","httpupgrade","xhttp_auto"]))
              )
              event_at = (now - timedelta(days=5-i)).isoformat(timespec="seconds")
              message = f"Created client '{name}' (visual-{i+1:02d})." if i == 5 else f"Visual preview: service created for {name}"
              db.execute("INSERT INTO events(at,level,message) VALUES(?,?,?)",
                         (event_at, "INFO", message))
          db.commit()
          db.close()
          print("Seeded 6 isolated visual-preview clients and events.")
          PY
      - name: Install browser for real screenshots
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture login, dashboard, sections and mobile menu
        run: |
          mkdir -p visual-preview
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          base = "http://127.0.0.1:18080"
          out = Path("visual-preview")
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 1000}, device_scale_factor=1)
              errors = []
              page.on("pageerror", lambda e: errors.append(str(e) + " | " + str(getattr(e, "stack", ""))))
              page.goto(base + "/login", wait_until="domcontentloaded")
              print("LOGIN_LAYOUT=" + str(page.locator(".login-layout").evaluate("(e) => ({grid:getComputedStyle(e).gridTemplateColumns,display:getComputedStyle(e).display,visual:getComputedStyle(e.querySelector('.login-visual')).display,repairText:(document.getElementById('abyss-layout-repair')||{}).textContent?.includes('Reference correction'),repairCount:document.querySelectorAll('#abyss-layout-repair').length,repairStyles:[...document.querySelectorAll('style')].filter(s=>s.id==='abyss-layout-repair').map(s=>({len:s.textContent.length,grid:s.textContent.includes('grid-template-columns:minmax(0,1fr)!important')}))})")))
              login_geometry = page.evaluate("""() => {
                const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height,display:getComputedStyle(e).display}};
                const overlap=(a,b)=>!(a.right<=b.x||b.right<=a.x||a.bottom<=b.y||b.bottom<=a.y);
                const orbit=box(document.querySelector('.login-visual .visual-orbit'));
                const wordmark=box(document.querySelector('.login-visual .visual-eyebrow'));
                const subtitle=box(document.querySelector('.login-visual h2'));
                const card=box(document.querySelector('.login-layout>.card'));
                return {viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,orbit,wordmark,subtitle,card,
                  orbitCardOverlap:orbit&&card?overlap(orbit,card):true,
                  wordmarkCardOverlap:wordmark&&card?overlap(wordmark,card):true,
                  brandVisible:!!wordmark&&!!subtitle&&wordmark.display!=='none'&&subtitle.display!=='none',
                  brandAboveCard:!!subtitle&&subtitle.bottom<=card.y+1};
              }""")
              print("LOGIN_GEOMETRY=" + repr(login_geometry))
              if login_geometry["documentWidth"] > login_geometry["viewport"] + 1:
                  raise SystemExit("Login has horizontal overflow: " + repr(login_geometry))
              if not login_geometry["brandVisible"] or login_geometry["orbitCardOverlap"] or login_geometry["wordmarkCardOverlap"] or not login_geometry["brandAboveCard"]:
                  raise SystemExit("Login brand/orbit is hidden, overlaps the form, or sits below it: " + repr(login_geometry))
              page.screenshot(path=str(out / "01-login-desktop.png"), full_page=False, animations="disabled")
              page.locator('input[name="username"]').fill("admin")
              page.locator('input[name="password"]').fill("admin")
              page.locator("form button").last.click()
              page.wait_for_url(lambda url: "/login" not in url, timeout=15000)
              # The dashboard finishes its status/metrics requests asynchronously; wait for health data, then allow another real telemetry sample for the graph.
              page.wait_for_function("""() => {
                const e=document.getElementById('dashboardComponentStatus');
                return e && e.querySelectorAll('.dashboard-component').length === 4;
              }""", timeout=45000)
              page.wait_for_timeout(16000)
              chart_history = page.evaluate("""async () => {
                const response=await fetch('/api/system/metrics',{cache:'no-store'});
                const data=await response.json();
                const canvas=document.getElementById('usageSparkline');
                const label=canvas?.getAttribute('aria-label')||'';
                const match=label.match(/(\d+)$/);
                return {httpStatus:response.status,apiSamples:Array.isArray(data.history)?data.history.length:0,renderedSamples:match?Number(match[1]):0,canvasWidth:canvas?.width||0};
              }""")
              print("CHART_HISTORY=" + repr(chart_history))
              if chart_history["httpStatus"] != 200 or chart_history["renderedSamples"] < 1 or chart_history["canvasWidth"] < 100:
                  raise SystemExit("Dashboard resource chart did not render actual metrics: " + repr(chart_history))
              if chart_history["apiSamples"] > 2 and chart_history["renderedSamples"] < min(24, chart_history["apiSamples"]) - 2:
                  raise SystemExit("Dashboard chart ignored the API metrics history: " + repr(chart_history))
              def visible_sections(target):
                  return target.locator("[data-section-page]").evaluate_all("(els) => els.filter(e => getComputedStyle(e).display !== 'none' && e.getBoundingClientRect().height > 0).map(e => e.dataset.sectionPage)")
              def assert_active_section(name):
                  page.wait_for_function("""expected => {
                    const visible = [...document.querySelectorAll('[data-section-page]')].filter(e =>
                      getComputedStyle(e).display !== 'none' && e.getBoundingClientRect().height > 0);
                    return visible.length > 0 && visible.every(e => e.dataset.sectionPage === expected);
                  }""", arg=name, timeout=5000)
                  actual = visible_sections(page)
                  print("ACTIVE_SECTION_" + name.upper() + "=" + repr(actual))
                  if not actual or any(section != name for section in actual):
                      raise SystemExit("Navigation showed inactive sections for " + name + ": " + repr(actual))
              assert_active_section("dashboard")
              dashboard_layout = page.evaluate("""() => {
                const rect = id => { const e = document.getElementById(id); const r = e.getBoundingClientRect(); return {x:r.x,y:r.y,width:r.width,height:r.height}; };
                const chart=rect('dashboardUsageCard'), health=rect('panelHealthCard'), quick=rect('dashboardQuickCard'), stats=rect('overviewStats'), top=rect('sectionTitle');
                const recent=document.querySelector('#dashboardQuickCard #recentActivityList');
                const activity=recent?{count:recent.querySelectorAll('.report-event').length,clientHeight:recent.clientHeight,scrollHeight:recent.scrollHeight}:null;
                const overlaps=(x,y)=>!(x.x+x.width<=y.x || y.x+y.width<=x.x || x.y+x.height<=y.y || y.y+y.height<=x.y);
                const sameRow=Math.max(chart.y,health.y,quick.y)-Math.min(chart.y,health.y,quick.y)<2;
                return {viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,top,stats,chart,health,quick,sameRow,activity,
                  chartXBeforeHealth:chart.x<health.x,healthXBeforeQuick:health.x<quick.x,
                  statsChartOverlap:overlaps(stats,chart),statsHealthOverlap:overlaps(stats,health),statsQuickOverlap:overlaps(stats,quick),
                  chartHealthOverlap:overlaps(chart,health),chartQuickOverlap:overlaps(chart,quick),healthQuickOverlap:overlaps(health,quick),
                  statsAboveCards:stats.y+stats.height<=Math.min(chart.y,health.y,quick.y)+1};
              }""")
              print("DASHBOARD_LAYOUT=" + repr(dashboard_layout))
              sidebar_layout = page.evaluate("""() => {
                const r = e => { const b=e.getBoundingClientRect(); return {top:b.top,bottom:b.bottom,height:b.height}; };
                const nav=document.querySelector('#sidebar>.side-nav');
                const captions=[...document.querySelectorAll('#sidebar>.side-caption')]; const caption=captions[captions.length-1];
                const account=document.querySelector('#sidebar>.sidebar-account-badge');
                const links=document.querySelector('#sidebar>.abyss-utility-links');
                return {nav:nav?r(nav):null,account:account?r(account):null,caption:caption?r(caption):null,links:links?r(links):null,scrollHeight:document.querySelector('#sidebar')?.scrollHeight,clientHeight:document.querySelector('#sidebar')?.clientHeight};
              }""")
              print("SIDEBAR_LAYOUT=" + repr(sidebar_layout))
              if not sidebar_layout["nav"] or not sidebar_layout["account"] or not sidebar_layout["caption"] or sidebar_layout["nav"]["bottom"] > sidebar_layout["account"]["top"] + 1:
                  raise SystemExit("Sidebar account overlaps navigation: " + repr(sidebar_layout))
              if sidebar_layout["account"]["bottom"] > sidebar_layout["caption"]["top"] + 1:
                  raise SystemExit("Sidebar creator label overlaps account identity: " + repr(sidebar_layout))
              if sidebar_layout["links"] and sidebar_layout["caption"]["bottom"] > sidebar_layout["links"]["top"] + 1:
                  raise SystemExit("Sidebar utility links overlap creator label: " + repr(sidebar_layout))
              if dashboard_layout["documentWidth"] > dashboard_layout["viewport"] + 1:
                  raise SystemExit("Desktop layout has horizontal overflow: " + repr(dashboard_layout))
              if dashboard_layout["statsChartOverlap"] or dashboard_layout["statsHealthOverlap"] or dashboard_layout["statsQuickOverlap"] or not dashboard_layout["statsAboveCards"]:
                  raise SystemExit("Dashboard metrics overlap monitoring cards or appear below them: " + repr(dashboard_layout))
              if not dashboard_layout["sameRow"] or not dashboard_layout["chartXBeforeHealth"] or not dashboard_layout["healthXBeforeQuick"]:
                  raise SystemExit("Dashboard cards do not match the reference row order (chart left, health center, quick details right): " + repr(dashboard_layout))
              if any(dashboard_layout[k] for k in ("chartHealthOverlap","chartQuickOverlap","healthQuickOverlap")):
                  raise SystemExit("Dashboard cards overlap: " + repr(dashboard_layout))
              if dashboard_layout["activity"] and dashboard_layout["activity"]["scrollHeight"] > dashboard_layout["activity"]["clientHeight"] + 1:
                  raise SystemExit("Recent dashboard activity is clipped inside its card: " + repr(dashboard_layout["activity"]))
              recent_activity = page.locator("#recentActivityList").inner_text()
              if "Administrator signed in as" in recent_activity or "Created client " in recent_activity or "Visual preview:" in recent_activity:
                  raise SystemExit("Dashboard recent activity contains untranslated English messages: " + recent_activity)
              xray_state = page.evaluate("""async () => {
                const r=await fetch('/api/overview',{cache:'no-store'}), d=await r.json();
                return {http:r.status,actual:d.xray?.running?'متصل':d.xray?.installed?'متوقف':'نصب نشده',
                  shown:document.querySelector('#dashboardQuickDetails .quick-detail-row strong')?.textContent?.trim()||''};
              }""")
              print("XRAY_STATUS_UI=" + repr(xray_state))
              if xray_state["http"] != 200 or xray_state["actual"] != xray_state["shown"]:
                  raise SystemExit("Quick dashboard status differs from the actual Xray state: " + repr(xray_state))
              page.screenshot(path=str(out / "02-dashboard-desktop.png"), full_page=False, animations="disabled")
              for nav, filename in [("clients","03-users-desktop.png"),("create","04-create-desktop.png"),("servers","05-servers-desktop.png"),("protocols","06-protocols-desktop.png"),("reports","07-reports-desktop.png"),("settings","08-settings-desktop.png")]:
                  locator = page.locator('[data-nav="' + nav + '"]').first
                  if not locator.count():
                      raise SystemExit("Missing navigation item: " + nav)
                  locator.click()
                  assert_active_section(nav)
                  if nav == "create":
                      tabs = page.locator('#createServiceCard .creation-tab[role="tab"]')
                      if tabs.count() != 3:
                          raise SystemExit("Create service page must expose the three reference tabs")
                      page.locator('#creationTabLimits').click()
                      if not page.locator('#creationPanelLimits').is_visible() or page.locator('#creationPanelGeneral').is_visible():
                          raise SystemExit("Create service limits tab did not switch panels")
                      page.locator('#creationTabProfiles').click()
                      if not page.locator('#creationPanelProfiles').is_visible() or page.locator('#clientProfileChoices input[name="clientProfile"]').count() < 1:
                          raise SystemExit("Create service protocol tab has no profile checkboxes")
                      page.locator('#creationTabGeneral').click()
                      if not page.locator('#creationPanelGeneral').is_visible() or page.locator('#creationTabGeneral').get_attribute('aria-selected') != 'true':
                          raise SystemExit("Create service general tab did not restore correctly")
                      # Capture the protocol-choice state that matches the supplied reference, not the temporary tab used for the interaction test.
                      page.locator('#creationTabProfiles').click()
                      if not page.locator('#creationPanelProfiles').is_visible():
                          raise SystemExit("Create service preview did not return to the reference protocol-choice panel")
                      profile_columns = page.locator('#clientProfileChoices').evaluate("(e) => getComputedStyle(e).gridTemplateColumns.split(' ').length")
                      print("CREATE_PROFILE_COLUMNS=" + repr(profile_columns))
                      if profile_columns != 4:
                          raise SystemExit("Desktop protocol choices must use the reference four-column grid: " + repr(profile_columns))
                  if nav == "servers":
                      page.wait_for_function("""() => {
                        const e=document.getElementById('serverStatusGrid');
                        return e && !e.innerText.includes('در حال بررسی اجزا');
                      }""", timeout=45000)
                      diagnosis = page.evaluate("""async () => {
                        const r = await fetch('/api/system/diagnostics', {cache:'no-store'});
                        return {httpStatus:r.status, data:await r.json()};
                      }""")
                      diagnostic_data = diagnosis["data"]
                      failures = [x for x in diagnostic_data.get("profiles", [])
                                  if x.get("enabled") and (not x.get("listener_ok") or not x.get("route_ok"))]
                      print("SERVER_DIAGNOSTICS=" + repr({
                        "httpStatus":diagnosis["httpStatus"],
                        "summary":diagnostic_data.get("summary"),
                        "nginx_ok":diagnostic_data.get("nginx_ok"),
                        "failedRoutes":[{"key":x.get("key"),"status":x.get("status"),"http":x.get("http_status"),"error":x.get("error"),"hint":x.get("hint")} for x in failures]
                      }))
                      if diagnosis["httpStatus"] != 200 or not diagnostic_data.get("nginx_ok") or failures:
                          raise SystemExit("Live server diagnostics found configuration or route failures")
                      note_lengths = page.locator("#serverStatusGrid .server-state .small").evaluate_all("(els) => els.map(e => (e.textContent || '').trim().length)")
                      print("SERVER_STATUS_NOTE_LENGTHS=" + repr(note_lengths))
                      if note_lengths and max(note_lengths) > 240:
                          raise SystemExit("Server status cards contain unbounded diagnostic/debug output: " + repr(note_lengths))
                  elif nav == "reports":
                      page.wait_for_function("""() => {
                        const e=document.getElementById('reportSummary');
                        return e && !e.innerText.includes('در حال اجرای بررسی‌های واقعی');
                      }""", timeout=45000)
                  elif nav == "clients":
                      page.wait_for_function("""() => {
                        const table=document.querySelector('#clients .clients-table tbody');
                        const details=document.getElementById('clientDetailsPanel');
                        return table && table.querySelectorAll('tr').length>0 && details && details.innerText.trim().length>0;
                      }""", timeout=45000)
                      client_view=page.evaluate("""() => ({rows:document.querySelectorAll('#clients .clients-table tbody tr').length,detail:!!document.querySelector('#clientDetailsPanel .client-detail-head'),pagination:!!document.querySelector('#clients .client-pagination')})""")
                      print("CLIENT_TABLE_VIEW=" + repr(client_view))
                      if client_view["rows"]<1 or not client_view["detail"] or not client_view["pagination"]:
                          raise SystemExit("Client table/detail/pagination view is incomplete: " + repr(client_view))
                  elif nav == "protocols":
                      page.wait_for_function("""() => {
                        const table=document.querySelector('#protocolCatalog .protocol-table tbody');
                        return table && table.querySelectorAll('tr').length>0;
                      }""", timeout=45000)
                      protocol_view=page.evaluate("""() => ({rows:document.querySelectorAll('#protocolCatalog .protocol-table tbody tr').length,toggles:document.querySelectorAll('#protocolCatalog .protocol-table-toggle input[type=checkbox]').length})""")
                      print("PROTOCOL_TABLE_VIEW=" + repr(protocol_view))
                      if protocol_view["rows"]<1 or protocol_view["toggles"] != protocol_view["rows"]:
                          raise SystemExit("Protocol table/toggles are incomplete: " + repr(protocol_view))
                  page.screenshot(path=str(out / filename), full_page=False, animations="disabled")
              page.locator('[data-nav="dashboard"]').first.click()
              assert_active_section("dashboard")
              page.set_viewport_size({"width":1024,"height":768})
              page.wait_for_timeout(300)
              tablet_layout = page.evaluate("""() => {
                const rect=id=>{const e=document.getElementById(id);const b=e.getBoundingClientRect();return {x:b.x,y:b.y,width:b.width,height:b.height}};
                const overlaps=(a,b)=>!(a.x+a.width<=b.x||b.x+b.width<=a.x||a.y+a.height<=b.y||b.y+b.height<=a.y);
                const stats=rect('overviewStats'),chart=rect('dashboardUsageCard'),health=rect('panelHealthCard'),quick=rect('dashboardQuickCard');
                const tools=document.querySelector('.workspace>.top>.tools');
                return {viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,stats,chart,health,quick,
                  toolbar:tools?{clientWidth:tools.clientWidth,scrollWidth:tools.scrollWidth,wrap:getComputedStyle(tools).flexWrap}:null,
                  statsOverlap:overlaps(stats,chart)||overlaps(stats,health)||overlaps(stats,quick),
                  cardsOverlap:overlaps(chart,health)||overlaps(chart,quick)||overlaps(health,quick),
                  chartHealthSameRow:Math.abs(chart.y-health.y)<2,chartLeftOfHealth:chart.x<health.x,
                  quickBelowCards:quick.y>=Math.max(chart.y+chart.height,health.y+health.height)-1};
              }""")
              print("TABLET_LAYOUT=" + repr(tablet_layout))
              if tablet_layout["documentWidth"] > tablet_layout["viewport"] + 1:
                  raise SystemExit("Tablet layout has horizontal overflow: " + repr(tablet_layout))
              if tablet_layout["statsOverlap"] or tablet_layout["cardsOverlap"]:
                  raise SystemExit("Tablet dashboard cards overlap: " + repr(tablet_layout))
              if not tablet_layout["chartHealthSameRow"] or not tablet_layout["chartLeftOfHealth"] or not tablet_layout["quickBelowCards"]:
                  raise SystemExit("Tablet dashboard does not follow the intended chart/status/details order: " + repr(tablet_layout))
              if tablet_layout["toolbar"] and tablet_layout["toolbar"]["scrollWidth"] > tablet_layout["toolbar"]["clientWidth"] + 1:
                  raise SystemExit("Tablet toolbar clips or horizontally overflows its controls: " + repr(tablet_layout))
              page.screenshot(path=str(out / "13-dashboard-tablet.png"), full_page=False, animations="disabled")
              subscription = browser.new_page(viewport={"width":1440,"height":1000}, device_scale_factor=1)
              subscription.on("pageerror", lambda e: errors.append("subscription: " + str(e) + " | " + str(getattr(e, "stack", ""))))
              response = subscription.goto(base + "/sub/preview-visual-token-0001", wait_until="domcontentloaded")
              if response is None or response.status >= 400:
                  raise SystemExit("Subscription page did not load successfully: " + str(response.status if response else None))
              subscription.wait_for_selector(".profile-choice", timeout=5000)
              if subscription.locator(".profile-choice").count() < 3 or not subscription.locator(".hero h1").count():
                  raise SystemExit("Subscription page is missing its service overview or connection profiles")
              qr = subscription.locator("img.qr")
              qr_result = qr.evaluate("""img => ({
                src: img.currentSrc || img.src,
                complete: img.complete,
                naturalWidth: img.naturalWidth,
                naturalHeight: img.naturalHeight
              })""")
              print("SUBSCRIPTION_QR=" + repr(qr_result))
              if not qr_result["complete"] or qr_result["naturalWidth"] < 1 or qr_result["naturalHeight"] < 1:
                  qr_response = subscription.request.get(qr_result["src"])
                  print("SUBSCRIPTION_QR_RESPONSE=" + repr({
                    "status": qr_response.status,
                    "contentType": qr_response.headers.get("content-type"),
                    "bodyPrefix": qr_response.body()[:180]
                  }))
                  raise SystemExit("Subscription QR failed to render: " + repr(qr_result))
              subscription.screenshot(path=str(out / "11-subscription-desktop.png"), full_page=True, animations="disabled")
              subscription_mobile = browser.new_page(viewport={"width":390,"height":844}, device_scale_factor=1, is_mobile=True, has_touch=True)
              subscription_mobile.on("pageerror", lambda e: errors.append("subscription mobile: " + str(e) + " | " + str(getattr(e, "stack", ""))))
              sub_response = subscription_mobile.goto(base + "/sub/preview-visual-token-0001", wait_until="domcontentloaded")
              if sub_response is None or sub_response.status >= 400:
                  raise SystemExit("Mobile subscription page did not load successfully")
              sub_overflow = subscription_mobile.evaluate("() => ({viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth})")
              print("SUBSCRIPTION_MOBILE_OVERFLOW=" + repr(sub_overflow))
              if max(sub_overflow["documentWidth"],sub_overflow["bodyWidth"]) > sub_overflow["viewport"] + 1:
                  raise SystemExit("Subscription page has horizontal overflow: " + repr(sub_overflow))
              subscription_mobile.screenshot(path=str(out / "12-subscription-mobile.png"), full_page=True, animations="disabled")
              mobile = browser.new_page(viewport={"width":390,"height":844}, device_scale_factor=1, is_mobile=True, has_touch=True)
              mobile.on("pageerror", lambda e: errors.append("mobile: " + str(e) + " | " + str(getattr(e, "stack", ""))))
              mobile.goto(base + "/login", wait_until="domcontentloaded")
              mobile.locator('input[name="username"]').fill("admin")
              mobile.locator('input[name="password"]').fill("admin")
              mobile.locator("form button").last.click()
              mobile.wait_for_url(lambda url: "/login" not in url, timeout=15000)
              mobile.wait_for_timeout(500)
              mobile_overflow = mobile.evaluate("() => ({viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,headerHeight:document.querySelector('.workspace>.top')?.getBoundingClientRect().height})")
              print("MOBILE_OVERFLOW=" + repr(mobile_overflow))
              if max(mobile_overflow["documentWidth"],mobile_overflow["bodyWidth"]) > mobile_overflow["viewport"] + 1:
                  raise SystemExit("Mobile layout has horizontal overflow: " + repr(mobile_overflow))
              if mobile_overflow["headerHeight"] is None or mobile_overflow["headerHeight"] > 430:
                  raise SystemExit("Mobile toolbar is excessively tall instead of using compact controls: " + repr(mobile_overflow))
              mobile.screenshot(path=str(out / "09-dashboard-mobile.png"), full_page=False, animations="disabled")
              toggle = mobile.locator("#menuToggle")
              if not toggle.count():
                  raise SystemExit("Mobile drawer toggle is missing")
              toggle.click()
              mobile.wait_for_function("document.body.classList.contains('abyss-menu-open') && document.querySelector('#sidebar').classList.contains('open')", timeout=3000)
              mobile.wait_for_timeout(350)
              drawer_layers = mobile.evaluate("""() => {
                const sidebar=document.getElementById('sidebar'), shade=document.getElementById('abyssMenuShade');
                const captions=[...sidebar.querySelectorAll(':scope>.side-caption')], nav=sidebar.querySelector(':scope>.side-nav'), account=sidebar.querySelector(':scope>.sidebar-account-badge'), links=sidebar.querySelector(':scope>.abyss-utility-links');
                const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom,height:r.height}};
                return {shadeParent:shade?.parentElement?.className, shadeZ:shade?Number(getComputedStyle(shade).zIndex):null,
                  sidebarZ:Number(getComputedStyle(sidebar).zIndex), sidebarFilter:getComputedStyle(sidebar).filter,
                  nav:box(nav),account:box(account),caption:box(captions[captions.length-1]),links:box(links),
                  menuOpen:document.body.classList.contains('abyss-menu-open')};
              }""")
              print("MOBILE_DRAWER_LAYERS=" + repr(drawer_layers))
              if drawer_layers["shadeParent"] != "app-shell" or drawer_layers["shadeZ"] >= drawer_layers["sidebarZ"] or drawer_layers["sidebarFilter"] != "none":
                  raise SystemExit("Mobile overlay obscures or blurs the drawer: " + repr(drawer_layers))
              if not drawer_layers["nav"] or not drawer_layers["account"] or not drawer_layers["caption"] or drawer_layers["nav"]["bottom"] > drawer_layers["account"]["top"] + 1:
                  raise SystemExit("Mobile drawer account overlaps navigation: " + repr(drawer_layers))
              if drawer_layers["account"]["bottom"] > drawer_layers["caption"]["top"] + 1:
                  raise SystemExit("Mobile drawer creator label overlaps account identity: " + repr(drawer_layers))
              if drawer_layers["links"] and drawer_layers["caption"]["bottom"] > drawer_layers["links"]["top"] + 1:
                  raise SystemExit("Mobile drawer utility links overlap creator label: " + repr(drawer_layers))
              mobile.screenshot(path=str(out / "10-mobile-menu.png"), full_page=False, animations="disabled")
              print("BROWSER_ERRORS=" + repr(errors))
              if errors:
                  raise SystemExit("Browser JavaScript errors detected: " + repr(errors))
              browser.close()
          PY
      - name: Upload visual preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: void-visual-preview
          path: visual-preview/
          if-no-files-found: warn
          retention-days: 7
      - name: Cleanup
        if: always()
        run: docker rm -f void-visual >/dev/null 2>&1 || true
