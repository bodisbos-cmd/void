                  legacyHeroHidden:getComputedStyle(document.querySelector('.hero')).display==='none',
                  legacyStatsHidden:getComputedStyle(document.querySelector('.grid')).display==='none'
                };
              }""")
              print("SUBSCRIPTION_MOBILE_LAYOUT=" + repr(sub_mobile_layout))
              if not sub_mobile_layout["mobileMetricsVisible"] or not sub_mobile_layout["referenceOrder"] or not sub_mobile_layout["noCardOverlap"] or not sub_mobile_layout["legacyHeroHidden"] or not sub_mobile_layout["legacyStatsHidden"]:
                  raise SystemExit("Subscription mobile layout diverged from the reference order: " + repr(sub_mobile_layout))
              subscription_mobile.screenshot(path=str(out / "12-subscription-mobile.png"), full_page=True, animations="disabled")
              mobile = browser.new_page(viewport={"width":390,"height":844}, device_scale_factor=1, is_mobile=True, has_touch=True)
              mobile.on("pageerror", lambda e: errors.append("mobile: " + str(e) + " | " + str(getattr(e, "stack", ""))))
              mobile.goto(base + "/login", wait_until="domcontentloaded")
              mobile.locator('input[name="username"]').fill("admin")
              mobile.locator('input[name="password"]').fill("admin")
              mobile.locator("form button").last.click()
              mobile.wait_for_url(lambda url: "/login" not in url, timeout=15000)
              mobile.wait_for_timeout(500)
              mobile_overflow = mobile.evaluate("() => ({viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,headerHeight:document.querySelector('.workspace>.top')?.getBoundingClientRect().height})")
              print("MOBILE_OVERFLOW=" + repr(mobile_overflow))
              if max(mobile_overflow["documentWidth"],mobile_overflow["bodyWidth"]) > mobile_overflow["viewport"] + 1:
                  raise SystemExit("Mobile layout has horizontal overflow: " + repr(mobile_overflow))
              if mobile_overflow["headerHeight"] is None or mobile_overflow["headerHeight"] > 430:
                  raise SystemExit("Mobile toolbar is excessively tall instead of using compact controls: " + repr(mobile_overflow))
              mobile.screenshot(path=str(out / "09-dashboard-mobile.png"), full_page=False, animations="disabled")
              # Voidling: validate the reference sprite, responsive docking, status popup, optional audio, drag and persistence.
              voidling_layout = mobile.evaluate("""async () => {
                const widget=document.getElementById('voidling-widget'), art=widget?.querySelector('.voidling-art');
                if (!widget || !art) return {missing:true};
                const r=widget.getBoundingClientRect(), stats=document.getElementById('overviewStats')?.getBoundingClientRect();
                const background=getComputedStyle(art).backgroundImage;
                const source=background.startsWith('url("') ? background.slice(5,-2) : '';
                let image={loaded:false,width:0,height:0};
                if(source.startsWith('data:image/webp;base64,')){
                  const testImage=new Image(); testImage.src=source;
                  try { await testImage.decode(); image={loaded:true,width:testImage.naturalWidth,height:testImage.naturalHeight}; } catch (_) {}
                }
                return {missing:false,rect:{x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height},
                  stats:stats?{top:stats.top,bottom:stats.bottom}:null,backgroundIsEmbeddedWebp:source.startsWith('data:image/webp;base64,'),
                  image,position: getComputedStyle(widget).position};
              }""")
              print("VOIDLING_MOBILE_LAYOUT=" + repr(voidling_layout))
              if voidling_layout.get("missing") or not voidling_layout["backgroundIsEmbeddedWebp"] or not voidling_layout["image"]["loaded"] or voidling_layout["image"]["width"] < 80:
                  raise SystemExit("Voidling reference artwork failed to decode: " + repr(voidling_layout))
              if abs(voidling_layout["rect"]["width"]-40)>1 or abs(voidling_layout["rect"]["height"]-44)>1:
                  raise SystemExit("Voidling mobile dimensions drifted from its responsive dock: " + repr(voidling_layout))
              if not voidling_layout["stats"] or voidling_layout["rect"]["bottom"] > voidling_layout["stats"]["top"]+1:
                  raise SystemExit("Voidling overlaps the mobile dashboard cards: " + repr(voidling_layout))
              state_frames=mobile.evaluate("""() => {
                const widget=document.getElementById('voidling-widget'), art=widget?.querySelector('.voidling-art');
                if (!widget || !art) return {missing:true};
                const previous=widget.dataset.state, frames={};
                for (const state of ['online','checking','error','sleep']) {
                  widget.dataset.state=state;
                  frames[state]=getComputedStyle(art).backgroundPosition;
                }
                widget.classList.add('is-reacting');
                frames.click=getComputedStyle(art).backgroundPosition;
                widget.classList.remove('is-reacting');
                widget.dataset.state=previous;
                return {missing:false,frames};
              }""")
              print("VOIDLING_REFERENCE_POSES=" + repr(state_frames))
              expected_frames={"online":"0% 50%","checking":"25% 50%","error":"50% 50%","sleep":"75% 50%","click":"100% 50%"}
              if state_frames.get("missing") or state_frames.get("frames") != expected_frames:
                  raise SystemExit("Voidling status poses do not map to all five source reference variants: " + repr(state_frames))
              if (voidling_layout["image"]["width"] != 500 or voidling_layout["image"]["height"] != 110
                      or voidling_layout["image"]["width"] % 5 != 0):
                  raise SystemExit("Voidling must use the five-frame reference sprite strip: " + repr(voidling_layout["image"]))
              mobile.evaluate("() => { const w=document.getElementById('voidling-widget'); w.dataset.state='sleep'; w.click(); }")
              mobile.wait_for_function("document.getElementById('voidling-widget')?.dataset.state==='online'",timeout=3000)
              mobile.wait_for_selector("#voidling-status-popover",state="visible",timeout=3000)
              print("VOIDLING_IDLE_WAKE=" + repr(mobile.evaluate("() => ({state:document.getElementById('voidling-widget')?.dataset.state,popup:!!document.getElementById('voidling-status-popover')})")))
              popup_layout=mobile.locator("#voidling-status-popover").evaluate("""e=>{const r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom,width:r.width,viewport:innerHeight,display:getComputedStyle(e).display,text:e.innerText}}""")
              print("VOIDLING_STATUS_POPOVER=" + repr(popup_layout))
              mobile.screenshot(path=str(out / "17-voidling-mobile-status.png"), full_page=False, animations="disabled")
              if "سرویس‌ها:" not in popup_layout["text"] or "کاربران:" not in popup_layout["text"]:
                  raise SystemExit("Voidling status popup is missing live service/user counts: " + repr(popup_layout))
              if popup_layout["top"] > 100 or popup_layout["bottom"] >= popup_layout["viewport"] or popup_layout["display"] == "none":
                  raise SystemExit("Voidling status popup is not docked at the top on mobile: " + repr(popup_layout))
              sound_toggle=mobile.locator("#voidling-sound-toggle")
              if not sound_toggle.count() or sound_toggle.get_attribute("aria-pressed") != "false":
                  raise SystemExit("Voidling optional sound control did not start in the off state")
              sound_toggle.click()
              sound_enabled=mobile.evaluate("() => localStorage.getItem('voidling-sound')==='on' && document.getElementById('voidling-sound-toggle')?.getAttribute('aria-pressed')==='true'")
              sound_toggle.click()
              sound_disabled=mobile.evaluate("() => localStorage.getItem('voidling-sound')==='off' && document.getElementById('voidling-sound-toggle')?.getAttribute('aria-pressed')==='false'")
              print("VOIDLING_OPTIONAL_SOUND=" + repr({"enabledAndPersisted":sound_enabled,"disabledAndPersisted":sound_disabled}))
              if not sound_enabled or not sound_disabled:
                  raise SystemExit("Voidling optional sound toggle failed to persist both states")
              mobile.locator("#voidling-dismiss").click()
              mobile.wait_for_selector("#voidling-status-popover",state="detached",timeout=3000)
              drag_box=mobile.locator("#voidling-widget").bounding_box()
              drag_start={"x":drag_box["x"]+drag_box["width"]/2,"y":drag_box["y"]+drag_box["height"]/2}
              await_mouse=mobile.mouse
              await_mouse.move(drag_start["x"],drag_start["y"])
              await_mouse.down()
              await_mouse.move(drag_start["x"]-24,drag_start["y"]+8,steps=5)
              await_mouse.up()
              mobile.wait_for_function("""() => {
                try { const p=JSON.parse(localStorage.getItem('voidling-position')||'null');return !!p&&Number.isFinite(p.x)&&Number.isFinite(p.y); } catch (_) { return false; }
              }""",timeout=3000)
              drag_saved=mobile.evaluate("() => JSON.parse(localStorage.getItem('voidling-position'))")
              moved_box=mobile.locator("#voidling-widget").bounding_box()
              if abs(moved_box["x"]-drag_saved["x"])>2 or abs(moved_box["y"]-drag_saved["y"])>2 or (abs(moved_box["x"]-drag_box["x"])<8 and abs(moved_box["y"]-drag_box["y"])<5):
                  raise SystemExit("Voidling drag did not update and persist its position: " + repr({"before":drag_box,"after":moved_box,"saved":drag_saved}))
              mobile.reload(wait_until="domcontentloaded")
              mobile.wait_for_selector("#voidling-widget",timeout=8000)
              mobile.wait_for_function("""expected => {
                const w=document.getElementById('voidling-widget');return w&&Math.abs(w.getBoundingClientRect().x-expected.x)<2&&Math.abs(w.getBoundingClientRect().y-expected.y)<2;
              }""",arg=drag_saved,timeout=5000)
              restored=mobile.locator("#voidling-widget").bounding_box()
              print("VOIDLING_DRAG_PERSISTENCE=" + repr({"saved":drag_saved,"restored":{"x":restored["x"],"y":restored["y"]}}))
              mobile.evaluate("() => { localStorage.removeItem('voidling-position'); localStorage.setItem('voidling-sound','off'); }")
              mobile.reload(wait_until="domcontentloaded")
              mobile.wait_for_selector("#voidling-widget",timeout=8000)
              mobile.wait_for_timeout(350)
              toggle = mobile.locator("#menuToggle")
              if not toggle.count():
                  raise SystemExit("Mobile drawer toggle is missing")
              toggle.click()
              mobile.wait_for_function("document.body.classList.contains('abyss-menu-open') && document.querySelector('#sidebar').classList.contains('open')", timeout=3000)
              mobile.wait_for_timeout(350)
              drawer_layers = mobile.evaluate("""() => {
                const sidebar=document.getElementById('sidebar'), shade=document.getElementById('abyssMenuShade');
                const captions=[...sidebar.querySelectorAll(':scope>.side-caption')], nav=sidebar.querySelector(':scope>.side-nav'), account=sidebar.querySelector(':scope>.sidebar-account-badge'), links=sidebar.querySelector(':scope>.abyss-utility-links');
                const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom,height:r.height}};
                return {shadeParent:shade?.parentElement?.className, shadeZ:shade?Number(getComputedStyle(shade).zIndex):null,
                  sidebarZ:Number(getComputedStyle(sidebar).zIndex), sidebarFilter:getComputedStyle(sidebar).filter,
                  nav:box(nav),account:box(account),caption:box(captions[captions.length-1]),links:box(links),
                  menuOpen:document.body.classList.contains('abyss-menu-open')};
              }""")
              print("MOBILE_DRAWER_LAYERS=" + repr(drawer_layers))
              if drawer_layers["shadeParent"] != "app-shell" or drawer_layers["shadeZ"] >= drawer_layers["sidebarZ"] or drawer_layers["sidebarFilter"] != "none":
                  raise SystemExit("Mobile overlay obscures or blurs the drawer: " + repr(drawer_layers))
              if not drawer_layers["nav"] or not drawer_layers["account"] or not drawer_layers["caption"] or drawer_layers["nav"]["bottom"] > drawer_layers["account"]["top"] + 1:
                  raise SystemExit("Mobile drawer account overlaps navigation: " + repr(drawer_layers))
              if drawer_layers["account"]["top"] < drawer_layers["caption"]["bottom"] - 1:
                  raise SystemExit("Mobile drawer creator label overlaps account identity: " + repr(drawer_layers))
              if drawer_layers["links"] and drawer_layers["caption"]["bottom"] > drawer_layers["links"]["top"] + 1:
                  raise SystemExit("Mobile drawer utility links overlap creator label: " + repr(drawer_layers))
              mobile.screenshot(path=str(out / "10-mobile-menu.png"), full_page=False, animations="disabled")
              # Check responsive client management and service creation, not only the dashboard shell.
              nav_reaction = mobile.evaluate("""() => {
                const target=document.querySelector('[data-nav="clients"]'), widget=document.getElementById('voidling-widget');
                if (!target || !widget) return {missing:true};
                target.click();
                return {missing:false,navigating:widget.classList.contains('is-navigating'),reacting:widget.classList.contains('is-reacting')};
              }""")
              print("VOIDLING_MENU_REACTION=" + repr(nav_reaction))
              if nav_reaction.get("missing") or not nav_reaction["navigating"] or not nav_reaction["reacting"]:
                  raise SystemExit("Voidling did not react when the mobile menu section changed: " + repr(nav_reaction))
              mobile.wait_for_function("""() => {
                const visible=[...document.querySelectorAll('[data-section-page]')].filter(e=>getComputedStyle(e).display!=='none'&&e.getBoundingClientRect().height>0);
                return visible.length>0&&visible.every(e=>e.dataset.sectionPage==='clients')
                  &&document.querySelectorAll('#clients .clients-table tbody tr').length>0
                  &&!!document.querySelector('#clientDetailsPanel .client-detail-head');
              }""", timeout=10000)
              mobile_clients = mobile.evaluate("""() => {
                const box=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height};};
                const table=box('#clients'),details=box('#clientDetailsPanel');
                return {viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,table,details,
                  noOverlap:!!table&&!!details&&(table.bottom<=details.y+1||details.bottom<=table.y+1)};
              }""")
              print("MOBILE_CLIENTS_LAYOUT=" + repr(mobile_clients))
              if max(mobile_clients["documentWidth"],mobile_clients["bodyWidth"])>mobile_clients["viewport"]+1 or not mobile_clients["noOverlap"]:
                  raise SystemExit("Mobile user-management layout overflows or overlaps: " + repr(mobile_clients))
              mobile.screenshot(path=str(out / "13-users-mobile.png"), full_page=True, animations="disabled")
              # Navigation to another section closes the mobile drawer; reopen it before selecting the next page.
              mobile.evaluate("""() => {
                if (!document.body.classList.contains('abyss-menu-open')) {
                  document.getElementById('menuToggle')?.click();
                }
              }""")
              mobile.wait_for_function("""() => document.body.classList.contains('abyss-menu-open')
                && document.querySelector('#sidebar')?.classList.contains('open')""", timeout=3000)
              mobile.locator('[data-nav="create"]').first.click()
              mobile.wait_for_function("""() => {
                const visible=[...document.querySelectorAll('[data-section-page]')].filter(e=>getComputedStyle(e).display!=='none'&&e.getBoundingClientRect().height>0);
                return visible.length>0&&visible.every(e=>e.dataset.sectionPage==='create')
                  &&document.querySelectorAll('#clientProfileChoices input[name="clientProfile"]').length>0;
              }""", timeout=10000)
              mobile_create = mobile.evaluate("""() => ({viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,
                activeTab:document.querySelector('#createServiceCard .creation-tab.is-active')?.dataset?.creationTab||document.querySelector('#createServiceCard .creation-tab.is-active')?.textContent?.trim(),
                profileChoices:document.querySelectorAll('#clientProfileChoices input[name="clientProfile"]').length,
                visiblePanel:[...document.querySelectorAll('#createServiceCard .creation-tab-panel')].filter(e=>getComputedStyle(e).display!=='none'&&!e.hidden).length})""")
              print("MOBILE_CREATE_LAYOUT=" + repr(mobile_create))
              if max(mobile_create["documentWidth"],mobile_create["bodyWidth"])>mobile_create["viewport"]+1 or mobile_create["profileChoices"]<1 or mobile_create["visiblePanel"]!=1:
                  raise SystemExit("Mobile service-creation layout overflows or hides its active panel: " + repr(mobile_create))
              mobile.screenshot(path=str(out / "14-create-mobile.png"), full_page=True, animations="disabled")
              # A fresh non-mobile context checks the tablet breakpoint for the same sections.
              tablet = browser.new_page(viewport={"width":1024,"height":768}, device_scale_factor=1)
              tablet.on("pageerror", lambda e: errors.append("tablet: " + str(e) + " | " + str(getattr(e, "stack", ""))))
              tablet.goto(base + "/login", wait_until="domcontentloaded")
              tablet.locator('input[name="username"]').fill("admin")
              tablet.locator('input[name="password"]').fill("admin")
              tablet.locator("form button").last.click()
              tablet.wait_for_url(lambda url: "/login" not in url, timeout=15000)
              tablet.wait_for_function("""() => {
                const e=document.getElementById('dashboardComponentStatus');
                return e && e.querySelectorAll('.dashboard-component').length===4;
              }""", timeout=45000)
              tablet.locator('[data-nav="clients"]').first.click()
              tablet.wait_for_function("""() => {
                const visible=[...document.querySelectorAll('[data-section-page]')].filter(e=>getComputedStyle(e).display!=='none'&&e.getBoundingClientRect().height>0);
                return visible.length>0&&visible.every(e=>e.dataset.sectionPage==='clients')
                  &&document.querySelectorAll('#clients .clients-table tbody tr').length>0
                  &&!!document.querySelector('#clientDetailsPanel .client-detail-head');
              }""", timeout=10000)
              tablet_clients = tablet.evaluate("""() => {
                const box=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();return {y:r.y,bottom:r.bottom,width:r.width};};
                const table=box('#clients'),details=box('#clientDetailsPanel');
                return {viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,table,details,
                  noOverlap:!!table&&!!details&&(table.bottom<=details.y+1||details.bottom<=table.y+1)};
              }""")
              print("TABLET_CLIENTS_LAYOUT=" + repr(tablet_clients))
              if max(tablet_clients["documentWidth"],tablet_clients["bodyWidth"])>tablet_clients["viewport"]+1 or not tablet_clients["noOverlap"]:
                  raise SystemExit("Tablet user-management layout overflows or overlaps: " + repr(tablet_clients))
              tablet.screenshot(path=str(out / "15-users-tablet.png"), full_page=True, animations="disabled")
              tablet.locator('[data-nav="create"]').first.click()
              tablet.wait_for_function("""() => {
                const visible=[...document.querySelectorAll('[data-section-page]')].filter(e=>getComputedStyle(e).display!=='none'&&e.getBoundingClientRect().height>0);
                return visible.length>0&&visible.every(e=>e.dataset.sectionPage==='create')
                  &&document.querySelectorAll('#clientProfileChoices input[name="clientProfile"]').length>0;
              }""", timeout=10000)
              tablet_create = tablet.evaluate("""() => ({viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,
                profileChoices:document.querySelectorAll('#clientProfileChoices input[name="clientProfile"]').length,
                visiblePanel:[...document.querySelectorAll('#createServiceCard .creation-tab-panel')].filter(e=>getComputedStyle(e).display!=='none'&&!e.hidden).length})""")
              print("TABLET_CREATE_LAYOUT=" + repr(tablet_create))
              if max(tablet_create["documentWidth"],tablet_create["bodyWidth"])>tablet_create["viewport"]+1 or tablet_create["profileChoices"]<1 or tablet_create["visiblePanel"]!=1:
                  raise SystemExit("Tablet service-creation layout overflows or hides its active panel: " + repr(tablet_create))
              tablet.screenshot(path=str(out / "16-create-tablet.png"), full_page=True, animations="disabled")
              tablet.close()
              print("BROWSER_ERRORS=" + repr(errors))
              if errors:
                  raise SystemExit("Browser JavaScript errors detected: " + repr(errors))
              browser.close()
          PY
      - name: Upload visual preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: void-visual-preview
          path: visual-preview/
          if-no-files-found: warn
          retention-days: 7
      - name: Cleanup
        if: always()
        run: docker rm -f void-visual >/dev/null 2>&1 || true
