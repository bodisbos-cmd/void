name: Visual preview
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ui/desktop-reference-layout
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Void
        run: docker build --pull -t void-visual:ci .
      - name: Start isolated preview
        run: |
          mkdir -p "$RUNNER_TEMP/void-visual-data"
          docker run -d --name void-visual -p 18080:8080 -e COOKIE_SECURE=0 -e ABYSS_TEST_MODE=1 -e BASE_URL=http://127.0.0.1:18080 -v "$RUNNER_TEMP/void-visual-data:/data" void-visual:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health | grep -q '"xray":"running"'; then exit 0; fi
            sleep 1
          done
          docker logs void-visual
          exit 1
      - name: Seed synthetic data for visual review only
        run: |
          docker exec -i void-visual python - <<'PY'
          import json, math, secrets, sqlite3, uuid
          from datetime import datetime, timedelta, timezone
          db = sqlite3.connect("/data/panel.sqlite3")
          now = datetime.now(timezone.utc)
          fixtures = [
              ("user123", 30, 100, 45.2),
              ("samira", 22, 50, 18.4),
              ("ali", 18, 30, 12.7),
              ("mohammad", 12, 20, 6.1),
              ("night", 8, 10, 3.6),
              ("reza", 3, 5, 1.2),
          ]
          for i, (name, days, quota_gb, used_gb) in enumerate(fixtures):
              created = (now - timedelta(days=i)).isoformat(timespec="seconds")
              expires = (now + timedelta(days=days)).isoformat(timespec="seconds")
              db.execute(
                  "INSERT INTO clients(id,name,client_uuid,sub_token,enabled,created_at,note,expires_at,quota_bytes,used_bytes,profile_keys,owner_id) VALUES(?,?,?,?,1,?,?,?,?,?,?,NULL)",
                  (f"visual-{i+1:02d}", name, str(uuid.uuid4()), ("preview-visual-token-0001" if i == 0 else secrets.token_urlsafe(24)), created,
                   "Visual preview fixture", expires, quota_gb * 1024**3, int(used_gb * 1024**3),
                   json.dumps(["ws","httpupgrade","xhttp_auto"]))
              )
              event_at = (now - timedelta(days=5-i)).isoformat(timespec="seconds")
              message = f"Created client '{name}' (visual-{i+1:02d})." if i == 5 else f"Visual preview: service created for {name}"
              db.execute("INSERT INTO events(at,level,message) VALUES(?,?,?)",
                         (event_at, "INFO", message))
          # Populate the reference dashboard's quick-details card with explicit preview-only events.
          db.execute("INSERT INTO events(at,level,message) VALUES(?,?,?)",
                     ((now - timedelta(minutes=12)).isoformat(timespec="seconds"), "INFO", "Administrator created a database backup"))
          db.execute("INSERT INTO events(at,level,message) VALUES(?,?,?)",
                     ((now - timedelta(minutes=5)).isoformat(timespec="seconds"), "INFO", "Updated enabled connection profiles"))
          # Seed isolated per-client history for the subscriber usage graph (never production data).
          for sample_index in range(31):
              sampled_at = int(now.timestamp()) - sample_index * 86400
              # Monotonic synthetic cumulative usage with reference-like changes in slope, ending at the fixture current total.
              variation_gb = 0.85 * math.sin(sample_index * 0.55) + 0.10 * math.sin(sample_index * 1.10)
              used_gb = 45.2 - sample_index * 0.77 + variation_gb
              db.execute(
                  "INSERT OR REPLACE INTO client_usage_history(client_id,sampled_at,used_bytes) VALUES(?,?,?)",
                  ("visual-01", sampled_at, int(used_gb * 1024**3)),
              )
          # Seed isolated system-wide chart history for deterministic dashboard visual regression tests.
          for sample_index in range(31):
              sampled_at = int(now.timestamp()) - sample_index * 3600
              # Slightly irregular, steadily rising synthetic history, matching the reference chart rather than a straight ramp.
              chronological_index = 30 - sample_index
              variation_gb = (0.00, 0.08, -0.04, 0.14, 0.02, -0.06, 0.11, 0.03)[chronological_index % 8]
              traffic_bytes = int((0.75 + (30 - sample_index) * 0.032 + variation_gb) * 1024**3)
              db.execute(
                  "INSERT OR REPLACE INTO metrics_history(sampled_at,recorded_traffic_bytes,cpu_percent,memory_used_percent) VALUES(?,?,?,?)",
                  (sampled_at, traffic_bytes, 18 + sample_index % 23, 31 + sample_index % 17),
              )
          db.commit()
          db.close()
          print("Seeded 6 isolated visual-preview clients, events, 31 per-client usage samples, and 31 system metrics samples.")
          PY
      - name: Install browser for real screenshots
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture login, dashboard, sections and mobile menu
        run: |
          mkdir -p visual-preview
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          base = "http://127.0.0.1:18080"
          out = Path("visual-preview")
          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--use-gl=angle", "--use-angle=swiftshader", "--enable-webgl", "--ignore-gpu-blocklist", "--enable-unsafe-swiftshader"])
              page = browser.new_page(viewport={"width": 1440, "height": 1000}, device_scale_factor=1)
              page.add_init_script("""(() => {
                const nativeSetTimeout=window.setTimeout.bind(window);
                window.setTimeout=(fn,delay,...args)=>nativeSetTimeout(fn,window.__voidlingFastSleepTest&&delay===45000?850:delay,...args);
              })()""")
              errors = []
              page.on("pageerror", lambda e: errors.append(str(e) + " | " + str(getattr(e, "stack", ""))))
              page.goto(base + "/login", wait_until="domcontentloaded")
              page.wait_for_function("""() => {
                const image = document.querySelector('.login-visual img.visual-orbit');
                return image && image.complete && image.naturalWidth > 0 && image.alt === 'AbyssTunnel · I.T.A.';
              }""", timeout=10000)
              print("LOGIN_LAYOUT=" + str(page.locator(".login-layout").evaluate("(e) => ({grid:getComputedStyle(e).gridTemplateColumns,display:getComputedStyle(e).display,visual:getComputedStyle(e.querySelector('.login-visual')).display,repairText:(document.getElementById('abyss-layout-repair')||{}).textContent?.includes('Reference correction'),repairCount:document.querySelectorAll('#abyss-layout-repair').length,repairStyles:[...document.querySelectorAll('style')].filter(s=>s.id==='abyss-layout-repair').map(s=>({len:s.textContent.length,grid:s.textContent.includes('grid-template-columns:minmax(0,1fr)!important')}))})")))
              login_geometry = page.evaluate("""() => {
                const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height,display:getComputedStyle(e).display}};
                const overlap=(a,b)=>!(a.right<=b.x||b.right<=a.x||a.bottom<=b.y||b.bottom<=a.y);
                const image=document.querySelector('.login-visual img.visual-orbit');
                const logo=box(image);
                const card=box(document.querySelector('.login-layout>.card'));
                const logoReady=!!image&&image.complete&&image.naturalWidth>0&&image.alt==='AbyssTunnel · I.T.A.';
                return {viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,logo,card,logoReady,
                  logoCardOverlap:logo&&card?overlap(logo,card):true,
                  logoSeparatedFromCard:!!logo&&!!card&&(logo.right<card.x-8||card.right<logo.x-8),
                  referenceScale:!!logo&&!!card&&logo.width>=300&&card.width>=500};
              }""")
              print("LOGIN_GEOMETRY=" + repr(login_geometry))
              if login_geometry["documentWidth"] > login_geometry["viewport"] + 1:
                  raise SystemExit("Login has horizontal overflow: " + repr(login_geometry))
              if (not login_geometry["logoReady"] or login_geometry["logoCardOverlap"]
                      or not login_geometry["logoSeparatedFromCard"] or not login_geometry["referenceScale"]):
                  raise SystemExit("Approved logo asset or login composition is incorrect: " + repr(login_geometry))
              page.screenshot(path=str(out / "01-login-desktop.png"), full_page=False, animations="disabled")
              page.locator('input[name="username"]').fill("admin")
              page.locator('input[name="password"]').fill("admin")
              page.locator("form button").last.click()
              page.wait_for_url(lambda url: "/login" not in url, timeout=15000)
              # The dashboard finishes its status/metrics requests asynchronously; wait for health data, then allow another real telemetry sample for the graph.
              page.wait_for_function("""() => {
                const e=document.getElementById('dashboardComponentStatus');
                return e && e.querySelectorAll('.dashboard-component').length === 4;
              }""", timeout=45000)
              # Wait for the chart API to return history; the isolated preview seeds deterministic
              # synthetic samples, so the check must not depend on live minute-based telemetry.
              page.wait_for_function("""async () => {
                const canvas=document.getElementById('usageSparkline');
                if (!canvas) return false;
                const response=await fetch('/api/system/metrics?period=24h',{cache:'no-store'});
                if (!response.ok) return false;
                const data=await response.json();
                return Array.isArray(data.traffic_history) && data.traffic_history.length >= 2;
              }""", timeout=45000)
              for period in ("7d","30d","24h"):
                  # Wait for this specific range request; then verify that the real canvas label switched too.
                  with page.expect_response(lambda response, p=period: "/api/system/metrics?period=" + p in response.url, timeout=20000) as period_response:
                      page.locator('[data-traffic-period="' + period + '"]').click()
                  if period_response.value.status != 200:
                      raise SystemExit("Traffic range request failed: " + period + " HTTP " + str(period_response.value.status))
                  page.wait_for_function("expected => document.querySelector('[data-traffic-period].is-active')?.dataset.trafficPeriod === expected && (document.getElementById('usageSparkline')?.getAttribute('aria-label') || '').includes(expected)", arg=period, timeout=20000)
              chart_history = page.evaluate("""async () => {
                const checks=[];
                for (const period of ['24h','7d','30d']) {
                  const response=await fetch('/api/system/metrics?period='+period,{cache:'no-store'});
                  const data=await response.json();
                  checks.push({period,status:response.status,periodEcho:data.period,count:Number(data.traffic_history_count)||0,points:Array.isArray(data.traffic_history)?data.traffic_history.length:0});
                }
                const canvas=document.getElementById('usageSparkline');
                const label=canvas?.getAttribute('aria-label')||'';
                const match=label.match(/([0-9]+)$/);
                return {checks,renderedPoints:match?Number(match[1]):0,canvasWidth:canvas?.width||0,
                  buttons:[...document.querySelectorAll('[data-traffic-period]')].map(e=>e.dataset.trafficPeriod),
                  activePeriod:document.querySelector('[data-traffic-period].is-active')?.dataset.trafficPeriod};
              }""")
              print("CHART_HISTORY=" + repr(chart_history))
              if len(chart_history["checks"]) != 3 or any(x["status"] != 200 or x["periodEcho"] != x["period"] or x["points"] < 1 or x["points"] > 121 or x["count"] < x["points"] for x in chart_history["checks"]):
                  raise SystemExit("Traffic history API returned invalid range data: " + repr(chart_history))
              if chart_history["renderedPoints"] < 1 or chart_history["renderedPoints"] > 121 or chart_history["canvasWidth"] < 100 or chart_history["buttons"] != ["24h","7d","30d"] or chart_history["activePeriod"] != "24h":
                  raise SystemExit("Dashboard bandwidth chart/range controls did not render correctly: " + repr(chart_history))
              def visible_sections(target):
                  return target.locator("[data-section-page]").evaluate_all("(els) => els.filter(e => getComputedStyle(e).display !== 'none' && e.getBoundingClientRect().height > 0).map(e => e.dataset.sectionPage)")
              def assert_active_section(name):
                  page.wait_for_function("""expected => {
                    const visible = [...document.querySelectorAll('[data-section-page]')].filter(e =>
                      getComputedStyle(e).display !== 'none' && e.getBoundingClientRect().height > 0);
                    return visible.length > 0 && visible.every(e => e.dataset.sectionPage === expected);
                  }""", arg=name, timeout=5000)
                  actual = visible_sections(page)
                  print("ACTIVE_SECTION_" + name.upper() + "=" + repr(actual))
                  if not actual or any(section != name for section in actual):
                      raise SystemExit("Navigation showed inactive sections for " + name + ": " + repr(actual))
              # Capture the live Voidling responsive cascade before navigation tests can abort the run.
              page.set_viewport_size({"width":1024,"height":768})
              page.wait_for_timeout(120)
              early_voidling_css = page.evaluate("""() => {
                const w=document.getElementById('voidling-widget'),s=document.getElementById('voidling-interactive-space');
                if(!w)return {missing:true};
                const c=getComputedStyle(w),rules=[];
                const walk=(list,media='all')=>{for(const r of list){
                  if(r.selectorText&&r.selectorText.includes('#voidling-widget'))rules.push({media,selector:r.selectorText,width:r.style.getPropertyValue('width'),height:r.style.getPropertyValue('height'),widthPriority:r.style.getPropertyPriority('width'),heightPriority:r.style.getPropertyPriority('height')});
                  if(r.cssRules&&r.cssRules.length)walk(r.cssRules,r.conditionText||media);
                }};
                let sheetError=null,sheetRuleCount=-1;
                try{if(s&&s.sheet){sheetRuleCount=s.sheet.cssRules.length;walk(s.sheet.cssRules)}}catch(e){sheetError=String(e)}
                return {viewport:innerWidth,rect:(()=>{const r=w.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}})(),
                  computed:{width:c.width,height:c.height,position:c.position,right:c.right,bottom:c.bottom},
                  inlineStyle:w.getAttribute('style'),mediaMatches:matchMedia('(min-width:601px) and (max-width:1100px)').matches,
                  styleTag:s?{tag:s.tagName,hasSheet:!!s.sheet,textLength:s.textContent.length,hasTabletRule:s.textContent.includes('@media(min-width:601px) and (max-width:1100px)')}:null,
                  sheetRuleCount,sheetError,rules};
              }""")
              print("VOIDLING_EARLY_TABLET_CSS=" + repr(early_voidling_css))
              page.set_viewport_size({"width":1440,"height":1000})
              page.wait_for_timeout(120)
              # Preserve Voidling evidence even if a separate dashboard-section assertion fails.
              # This is intentionally captured before the layout/navigation regression checks.
              early_widget = page.locator("#voidling-widget")
              if early_widget.count():
                  early_widget.evaluate("(e) => { e.style.width='180px'; e.style.height='200px'; e.style.right='24px'; e.style.bottom='24px'; }")
                  early_states = []
                  for state_name in ("online", "checking", "error", "sleep", "reacting"):
                      early_widget.evaluate("(e, state) => { e.dataset.state=state; e.classList.toggle('is-reacting', state==='reacting'); }", state_name)
                      page.wait_for_timeout(140)
                      shot = out / ("voidling-state-" + state_name + ".png")
                      early_widget.screenshot(path=str(shot), animations="disabled")
                      early_states.append({"state":state_name,"bytes":shot.stat().st_size if shot.exists() else 0})
                  print("VOIDLING_EARLY_STATE_SCREENSHOTS=" + repr(early_states))
                  early_widget.evaluate("(e) => { e.style.width=''; e.style.height=''; e.style.right=''; e.style.bottom=''; e.classList.remove('is-reacting'); e.dataset.state='online'; }")
              else:
                  print("VOIDLING_EARLY_STATE_SCREENSHOTS=widget-missing")
              assert_active_section("dashboard")
              dashboard_layout = page.evaluate("""() => {
                const rect = id => { const e = document.getElementById(id); const r = e.getBoundingClientRect(); return {x:r.x,y:r.y,width:r.width,height:r.height}; };
                const chart=rect('dashboardUsageCard'), health=rect('panelHealthCard'), quick=rect('dashboardQuickCard'), stats=rect('overviewStats'), top=rect('sectionTitle');
                const recent=document.querySelector('#dashboardQuickCard #recentActivityList');
                const activity=recent?{count:recent.querySelectorAll('.report-event').length,clientHeight:recent.clientHeight,scrollHeight:recent.scrollHeight,hidden:getComputedStyle(recent).display==='none'}:null;
                const quickDetailRows=[...document.querySelectorAll('#dashboardQuickDetails .quick-detail-row')];
                const quickDetailLabels=quickDetailRows.map(row=>row.querySelector('.quick-detail-copy .small')?.textContent?.trim()||'');
                const quickDetailValues=quickDetailRows.map(row=>row.querySelector('strong')?.textContent?.trim()||'');
                const overlaps=(x,y)=>!(x.x+x.width<=y.x || y.x+y.width<=x.x || x.y+x.height<=y.y || y.y+y.height<=x.y);
                const sameRow=Math.max(chart.y,health.y,quick.y)-Math.min(chart.y,health.y,quick.y)<2;
                return {viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,top,stats,chart,health,quick,sameRow,activity,quickDetailCount:quickDetailRows.length,quickDetailLabels,quickDetailValues,
                  chartXBeforeHealth:chart.x<health.x,healthXBeforeQuick:health.x<quick.x,
                  statsChartOverlap:overlaps(stats,chart),statsHealthOverlap:overlaps(stats,health),statsQuickOverlap:overlaps(stats,quick),
                  chartHealthOverlap:overlaps(chart,health),chartQuickOverlap:overlaps(chart,quick),healthQuickOverlap:overlaps(health,quick),
                  statsAboveCards:stats.y+stats.height<=Math.min(chart.y,health.y,quick.y)+1};
              }""")
              print("DASHBOARD_LAYOUT=" + repr(dashboard_layout))
              sidebar_layout = page.evaluate("""() => {
                const r = e => { const b=e.getBoundingClientRect(); return {top:b.top,bottom:b.bottom,height:b.height}; };
                const nav=document.querySelector('#sidebar>.side-nav');
                const captions=[...document.querySelectorAll('#sidebar>.side-caption')]; const caption=captions[captions.length-1];
                const account=document.querySelector('#sidebar>.sidebar-account-badge');
                const links=document.querySelector('#sidebar>.abyss-utility-links');
                return {nav:nav?r(nav):null,account:account?r(account):null,caption:caption?r(caption):null,links:links?r(links):null,scrollHeight:document.querySelector('#sidebar')?.scrollHeight,clientHeight:document.querySelector('#sidebar')?.clientHeight};
              }""")
              print("SIDEBAR_LAYOUT=" + repr(sidebar_layout))
              if not sidebar_layout["nav"] or not sidebar_layout["account"] or not sidebar_layout["caption"] or sidebar_layout["nav"]["bottom"] > sidebar_layout["account"]["top"] + 1:
                  raise SystemExit("Sidebar account overlaps navigation: " + repr(sidebar_layout))
              if sidebar_layout["account"]["top"] < sidebar_layout["caption"]["bottom"] - 1:
                  raise SystemExit("Sidebar creator label overlaps account identity: " + repr(sidebar_layout))
              if sidebar_layout["links"] and sidebar_layout["caption"]["bottom"] > sidebar_layout["links"]["top"] + 1:
                  raise SystemExit("Sidebar utility links overlap creator label: " + repr(sidebar_layout))
              if dashboard_layout["documentWidth"] > dashboard_layout["viewport"] + 1:
                  raise SystemExit("Desktop layout has horizontal overflow: " + repr(dashboard_layout))
              if dashboard_layout["statsChartOverlap"] or dashboard_layout["statsHealthOverlap"] or dashboard_layout["statsQuickOverlap"] or not dashboard_layout["statsAboveCards"]:
                  raise SystemExit("Dashboard metrics overlap monitoring cards or appear below them: " + repr(dashboard_layout))
              if not dashboard_layout["sameRow"] or not dashboard_layout["chartXBeforeHealth"] or not dashboard_layout["healthXBeforeQuick"]:
                  raise SystemExit("Dashboard cards do not match the reference row order (chart left, health center, quick details right): " + repr(dashboard_layout))
              if dashboard_layout["chart"]["width"] < dashboard_layout["health"]["width"] * 1.65 or dashboard_layout["chart"]["width"] < dashboard_layout["quick"]["width"] * 1.65:
                  raise SystemExit("Dashboard chart should remain the dominant reference card: " + repr(dashboard_layout))
              if any(dashboard_layout[k] for k in ("chartHealthOverlap","chartQuickOverlap","healthQuickOverlap")):
                  raise SystemExit("Dashboard cards overlap: " + repr(dashboard_layout))
              if dashboard_layout["quickDetailCount"] != 3 or any(not label for label in dashboard_layout["quickDetailLabels"]):
                  raise SystemExit("Dashboard quick-details card must render its three reference rows: " + repr(dashboard_layout["quickDetailLabels"]))
              expected_quick_values = ("user123", "پروفایل‌های اتصال به‌روزرسانی شدند", "نسخهٔ پشتیبان آماده شد")
              if tuple(dashboard_layout["quickDetailValues"]) != expected_quick_values:
                  raise SystemExit("Dashboard quick-details data does not match the seeded reference fixture: " + repr(dashboard_layout["quickDetailValues"]))
              if dashboard_layout["activity"] and (not dashboard_layout["activity"]["hidden"] or dashboard_layout["activity"]["scrollHeight"] > dashboard_layout["activity"]["clientHeight"] + 1):
                  raise SystemExit("The legacy activity list must stay hidden outside the reference quick-details card: " + repr(dashboard_layout["activity"]))
              recent_activity = page.locator("#recentActivityList").text_content() or ""
              if "Administrator signed in as" in recent_activity or "Created client " in recent_activity or "Visual preview:" in recent_activity:
                  raise SystemExit("Dashboard recent activity contains untranslated English messages: " + recent_activity)
              xray_state = page.evaluate("""async () => {
                const r=await fetch('/api/overview',{cache:'no-store'}), d=await r.json();
                return {http:r.status,actual:d.xray?.running?'متصل':d.xray?.installed?'متوقف':'نصب نشده',
                  shown:document.querySelector('#dashboardStatusAccessible .quick-detail-row strong')?.textContent?.trim()||''};
              }""")
              print("XRAY_STATUS_UI=" + repr(xray_state))
              if xray_state["http"] != 200 or xray_state["actual"] != xray_state["shown"]:
                  raise SystemExit("Quick dashboard status differs from the actual Xray state: " + repr(xray_state))
              page.locator("#langBtn").click()
              page.wait_for_function("""() => document.querySelector('#dashboardQuickCard .section-title')?.textContent?.trim()==='Quick details'
                && document.querySelector('#dashboardQuickDetails .quick-detail-copy .small')?.textContent?.trim()==='Latest service created'""", timeout=5000)
              page.locator("#langBtn").click()
              page.wait_for_function("""() => document.querySelector('#dashboardQuickCard .section-title')?.textContent?.trim()==='جزئیات سریع'
                && document.querySelector('#dashboardQuickDetails .quick-detail-copy .small')?.textContent?.trim()==='آخرین سرویس ساخته‌شده'""", timeout=5000)
              sidebar_logo = page.evaluate("""async () => {
                const mark=document.querySelector('.sidebar .side-brand .abyss-logo-mark');
                if (!mark) return {present:false};
                const r=mark.getBoundingClientRect(), style=getComputedStyle(mark);
                const response=await fetch('/brand/abyss-tunnel-logo.jpg',{cache:'no-store'});
                const blob=await response.blob();
                return {present:true,width:r.width,height:r.height,backgroundImage:style.backgroundImage,
                  http:response.status,bytes:blob.size};
              }""")
              print("SIDEBAR_REFERENCE_LOGO=" + repr(sidebar_logo))
              if (not sidebar_logo.get("present") or sidebar_logo["width"] < 24 or sidebar_logo["height"] < 24
                      or sidebar_logo["http"] != 200 or sidebar_logo["bytes"] < 1000
                      or "/brand/abyss-tunnel-logo.jpg" not in sidebar_logo["backgroundImage"]):
                  raise SystemExit("Sidebar is missing the supplied reference orbital logo: " + repr(sidebar_logo))
              page.wait_for_function("""() => {
                const w=document.getElementById('voidling-widget'), c=w?.querySelector('canvas.voidling-renderer');
                return w?.dataset.renderer==='webgl' && w?.dataset.model==='glb-mesh'
                  && Number(w?.dataset.meshCount)>=7 && c?.dataset.geometry==='glb-mesh' && !c?.dataset.error;
              }""", timeout=10000)
              voidling_3d = page.evaluate("""() => {
                const widget=document.getElementById('voidling-widget'), canvas=widget?.querySelector('canvas.voidling-renderer');
                let gl=null; try { gl=canvas?.getContext('webgl'); } catch (_) {}
                return {exists:!!widget,renderer:widget?.dataset.renderer,model:widget?.dataset.model,
                  geometry:canvas?.dataset.geometry,webgl:!!gl,meshCount:Number(widget?.dataset.meshCount)||0,rendererError:canvas?.dataset.error||null,
                  width:canvas?.width||0,height:canvas?.height||0};
              }""")
              print("VOIDLING_WEBGL_MODEL=" + repr(voidling_3d))
              if (not voidling_3d.get("exists") or voidling_3d.get("renderer") != "webgl"
                      or voidling_3d.get("model") != "glb-mesh" or not voidling_3d.get("webgl")
                      or voidling_3d.get("geometry") != "glb-mesh" or voidling_3d.get("meshCount", 0) < 7
                      or voidling_3d.get("width", 0) < 20 or voidling_3d.get("height", 0) < 20):
                  raise SystemExit("Voidling did not load/render the GLB 3D mesh: " + repr(voidling_3d))
              # Capture the actual WebGL model in every reference state. The sprite strip is
              # hidden when WebGL succeeds, so CSS background-position checks alone are not
              # evidence that the 3D face/body state rendered.
              state_preview = page.locator("#voidling-widget")
              state_preview.evaluate("(e) => { e.style.width='180px'; e.style.height='200px'; e.style.right='24px'; e.style.bottom='24px'; }")
              state_screenshots = []
              for state_name in ("online", "checking", "error", "sleep", "reacting"):
