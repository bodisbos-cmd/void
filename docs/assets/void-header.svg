<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="پس‌زمینه انتزاعی تیره و نقره‌ای Void">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020202"/><stop offset=".52" stop-color="#0a0a0c"/><stop offset="1" stop-color="#1b1b1f"/></linearGradient>
 <linearGradient id="beam"><stop stop-color="#8e8e96" stop-opacity="0"/><stop offset=".5" stop-color="#ededf3" stop-opacity=".76"/><stop offset="1" stop-color="#8e8e96" stop-opacity="0"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#d7d7dd" stop-opacity=".22"/><stop offset="1" stop-color="#d7d7dd" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="270" rx="26" fill="url(#bg)"/>
<ellipse cx="880" cy="132" rx="350" ry="205" fill="url(#halo)"/>
<ellipse cx="880" cy="132" rx="190" ry="80" fill="#d8d8e0" opacity=".07" filter="url(#blur)"><animate attributeName="opacity" values=".03;.12;.03" dur="8s" repeatCount="indefinite"/></ellipse>
<g fill="none" stroke="url(#beam)">
 <path d="M-30 240 L540 -20" stroke-width="3" opacity=".5"><animate attributeName="opacity" values=".12;.8;.12" dur="7s" repeatCount="indefinite"/></path>
 <path d="M-30 240 L540 -20" stroke-width="1.5"/>
 <path d="M120 290 L800 -20" stroke-width="1.5"><animateTransform attributeName="transform" type="translate" values="0 0;24 0;0 0" dur="13s" repeatCount="indefinite"/></path>
