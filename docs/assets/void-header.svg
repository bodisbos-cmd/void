 <circle cx="310" cy="70" r="1.2"/><circle cx="440" cy="187" r="1.4"><animate attributeName="opacity" values=".15;.9;.15" dur="4.2s" repeatCount="indefinite"/></circle>
 <circle cx="640" cy="40" r="1.2"/><circle cx="1080" cy="56" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="4.8s" repeatCount="indefinite"/></circle>
 <circle cx="1120" cy="226" r="1.1"/><circle cx="740" cy="210" r="1.3"><animate attributeName="cy" values="210;80;210" dur="12s" repeatCount="indefinite"/></circle>
</g>
