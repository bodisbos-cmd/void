<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">مسیرهای اتصال Void</title><desc id="desc">دو مسیر اتصال شامل پروفایل‌های HTTP از Railway Edge و یک مسیر مستقیم اختیاری از TCP Proxy است.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#040404"/><stop offset="1" stop-color="#141416"/></linearGradient><linearGradient id="edge"><stop stop-color="#777780" stop-opacity=".1"/><stop offset=".5" stop-color="#dedee4" stop-opacity=".7"/><stop offset="1" stop-color="#777780" stop-opacity=".1"/></linearGradient><linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a1a1e"/><stop offset="1" stop-color="#0a0a0c"/></linearGradient></defs>
<rect width="1200" height="330" rx="22" fill="url(#bg)"/>
<text x="600" y="31" fill="#ededf0" font-family="Vazirmatn,Tahoma,Arial,sans-serif" direction="rtl" unicode-bidi="plaintext" font-size="19" font-weight="700" text-anchor="middle">دو مسیر اتصال، بدون حذف گزینه‌های فعلی</text>
<text x="44" y="73" fill="#c4c4ca" font-family="Vazirmatn,Tahoma,Arial,sans-serif" direction="rtl" unicode-bidi="plaintext" font-size="14" font-weight="700">مسیر پیش‌فرض · HTTPS Edge</text>
<g stroke="url(#edge)" stroke-width="2" fill="none"><path d="M194 118 H243"/><path d="M408 118 H457"/><path d="M622 118 H671"/><path d="M836 118 H885"/></g>
<g fill="#c5c5cc"><path d="M237 112 l8 6 -8 6z"/><path d="M451 112 l8 6 -8 6z"/><path d="M665 112 l8 6 -8 6z"/><path d="M879 112 l8 6 -8 6z"/></g>
<g font-family="Vazirmatn,Tahoma,Arial,sans-serif" direction="rtl" unicode-bidi="plaintext" text-anchor="middle">
 <g><rect x="29" y="86" width="165" height="64" rx="12" fill="url(#node)" stroke="#85858d" stroke-opacity=".5"/><text x="111" y="112" fill="#ededf0" font-size="14">کلاینت</text><text x="111" y="133" fill="#9999a1" font-size="11">WS / XHTTP</text></g>
 <g><rect x="243" y="86" width="165" height="64" rx="12" fill="url(#node)" stroke="#85858d" stroke-opacity=".5"/><text x="325" y="112" fill="#ededf0" font-size="14">Railway Edge</text><text x="325" y="133" fill="#9999a1" font-size="11">HTTPS :443</text></g>
 <g><rect x="457" y="86" width="165" height="64" rx="12" fill="url(#node)" stroke="#85858d" stroke-opacity=".5"/><text x="539" y="112" fill="#ededf0" font-size="14">Nginx</text><text x="539" y="133" fill="#9999a1" font-size="11">پورت 8080</text></g>
 <g><rect x="671" y="86" width="165" height="64" rx="12" fill="url(#node)" stroke="#85858d" stroke-opacity=".5"/><text x="753" y="112" fill="#ededf0" font-size="14">Xray</text><text x="753" y="133" fill="#9999a1" font-size="11">listener داخلی</text></g>
 <g><rect x="885" y="86" width="165" height="64" rx="12" fill="url(#node)" stroke="#85858d" stroke-opacity=".5"/><text x="967" y="112" fill="#ededf0" font-size="14">اینترنت مقصد</text><text x="967" y="133" fill="#9999a1" font-size="11">خروجی freedom</text></g>
</g>
<path d="M44 174 H1156" stroke="url(#edge)" stroke-width="1"/>
<text x="44" y="210" fill="#c4c4ca" font-family="Vazirmatn,Tahoma,Arial,sans-serif" direction="rtl" unicode-bidi="plaintext" font-size="14" font-weight="700">مسیر اختیاری · TCP Proxy + REALITY/Vision</text>
<g stroke="url(#edge)" stroke-width="2" fill="none"><path d="M240 258 H315"/><path d="M485 258 H560"/><path d="M730 258 H805"/></g>
<g fill="#c5c5cc"><path d="M309 252 l8 6 -8 6z"/><path d="M554 252 l8 6 -8 6z"/><path d="M799 252 l8 6 -8 6z"/></g>
<g font-family="Vazirmatn,Tahoma,Arial,sans-serif" direction="rtl" unicode-bidi="plaintext" text-anchor="middle">
 <g><rect x="70" y="230" width="170" height="56" rx="12" fill="url(#node)" stroke="#aaaab2" stroke-opacity=".65"/><text x="155" y="253" fill="#ededf0" font-size="13">کلاینت</text><text x="155" y="272" fill="#9999a1" font-size="10">VLESS Vision</text></g>
 <g><rect x="315" y="230" width="170" height="56" rx="12" fill="url(#node)" stroke="#aaaab2" stroke-opacity=".65"/><text x="400" y="253" fill="#ededf0" font-size="13">TCP Proxy</text><text x="400" y="272" fill="#9999a1" font-size="10">دامنه و پورت Railway</text></g>
 <g><rect x="560" y="230" width="170" height="56" rx="12" fill="url(#node)" stroke="#aaaab2" stroke-opacity=".65"/><text x="645" y="253" fill="#ededf0" font-size="13">Xray · :10014</text><text x="645" y="272" fill="#9999a1" font-size="10">REALITY / TCP خام</text></g>
 <g><rect x="805" y="230" width="170" height="56" rx="12" fill="url(#node)" stroke="#aaaab2" stroke-opacity=".65"/><text x="890" y="253" fill="#ededf0" font-size="13">اینترنت مقصد</text><text x="890" y="272" fill="#9999a1" font-size="10">خروجی freedom</text></g>
</g>
<text x="1147" y="318" text-anchor="end" fill="#777780" font-family="Vazirmatn,Tahoma,Arial,sans-serif" direction="rtl" unicode-bidi="plaintext" font-size="10">مسیر مستقیم تنها پس از ساخت TCP Proxy فعال می‌شود؛ نتیجهٔ سرعت باید روی شبکهٔ واقعی سنجیده شود.</text>
