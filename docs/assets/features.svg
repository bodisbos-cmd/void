<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">قابلیت‌های Void</title><desc id="desc">شش کارت نقره‌ای با قابلیت‌های پنل Void روی پس‌زمینهٔ مشکی.</desc>
<defs>
