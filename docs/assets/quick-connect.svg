<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
<title id="title">Void — اتصال ساده</title><desc id="desc">نوار تیره با ذرات نقره‌ای متحرک و مراحل ساده اتصال.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030303"/><stop offset="1" stop-color="#171719"/></linearGradient><linearGradient id="shine"><stop stop-color="#88888f" stop-opacity="0"/><stop offset=".5" stop-color="#eeeeF2" stop-opacity=".8"/><stop offset="1" stop-color="#88888f" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="180" rx="22" fill="url(#bg)"/>
<g fill="none" stroke="url(#shine)" stroke-width="1.2" opacity=".5"><path d="M-100 150 L340 -30"><animateTransform attributeName="transform" type="translate" values="0 0; 90 0; 0 0" dur="9s" repeatCount="indefinite"/></path><path d="M400 200 L850 -20"><animateTransform attributeName="transform" type="translate" values="0 0; -80 0; 0 0" dur="12s" repeatCount="indefinite"/></path><path d="M850 200 L1280 0"><animateTransform attributeName="transform" type="translate" values="0 0; -60 0; 0 0" dur="10s" repeatCount="indefinite"/></path></g>
<g fill="#e5e5ea"><circle cx="110" cy="38" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle><circle cx="340" cy="142" r="1.2"><animate attributeName="opacity" values=".8;.15;.8" dur="4s" repeatCount="indefinite"/></circle><circle cx="700" cy="36" r="1.4"><animate attributeName="opacity" values=".15;.9;.15" dur="3.6s" repeatCount="indefinite"/></circle><circle cx="1030" cy="135" r="1.3"><animate attributeName="opacity" values=".9;.2;.9" dur="4.5s" repeatCount="indefinite"/></circle></g>
<g font-family="Vazirmatn,Tahoma,Arial,sans-serif" direction="rtl" unicode-bidi="plaintext"><text x="600" y="54" fill="#f0f0f2" font-size="25" font-weight="700" text-anchor="middle">شروع ساده با Void</text>
<g transform="translate(255 86)"><rect width="210" height="54" rx="13" fill="#161618" stroke="#85858d" stroke-opacity=".6"/><circle cx="30" cy="27" r="15" fill="#d5d5dc" fill-opacity=".12" stroke="#c8c8cf"/><text x="30" y="32" fill="#f1f1f3" font-size="14" text-anchor="middle">۱</text><text x="128" y="32" fill="#e8e8eb" font-size="16" text-anchor="middle">لینک اشتراک</text></g>
<g transform="translate(495 86)"><rect width="210" height="54" rx="13" fill="#161618" stroke="#85858d" stroke-opacity=".6"/><circle cx="30" cy="27" r="15" fill="#d5d5dc" fill-opacity=".12" stroke="#c8c8cf"/><text x="30" y="32" fill="#f1f1f3" font-size="14" text-anchor="middle">۲</text><text x="128" y="32" fill="#e8e8eb" font-size="16" text-anchor="middle">افزودن به برنامه</text></g>
<g transform="translate(735 86)"><rect width="210" height="54" rx="13" fill="#161618" stroke="#85858d" stroke-opacity=".6"/><circle cx="30" cy="27" r="15" fill="#d5d5dc" fill-opacity=".12" stroke="#c8c8cf"/><text x="30" y="32" fill="#f1f1f3" font-size="14" text-anchor="middle">۳</text><text x="128" y="32" fill="#e8e8eb" font-size="16" text-anchor="middle">اتصال</text></g></g></svg>