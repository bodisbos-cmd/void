<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">نقشهٔ استقرار Void</title><desc id="desc">کد GitHub از Dockerfile ساخته می‌شود و روی Railway با Nginx، FastAPI و Xray اجرا می‌شود. دیتابیس روی Volume پایدار است.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030303"/><stop offset="1" stop-color="#151517"/></linearGradient><linearGradient id="edge"><stop stop-color="#818189" stop-opacity=".1"/><stop offset=".5" stop-color="#e2e2e8" stop-opacity=".8"/><stop offset="1" stop-color="#818189" stop-opacity=".1"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c1c20"/><stop offset="1" stop-color="#0b0b0d"/></linearGradient></defs>
<rect width="1200" height="340" rx="22" fill="url(#bg)"/>
<text x="600" y="34" fill="#eeeef1" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700">نقشهٔ استقرار از کد تا سرویس</text>
<g stroke="url(#edge)" stroke-width="2" fill="none"><path d="M226 130 H258"/><path d="M450 130 H482"/><path d="M674 130 H706"/><path d="M898 130 H930"/><path d="M578 178 V216"/></g>
<g fill="#bdbdc4"><path d="M252 124 l8 6 -8 6z"/><path d="M476 124 l8 6 -8 6z"/><path d="M700 124 l8 6 -8 6z"/><path d="M924 124 l8 6 -8 6z"/><path d="M572 210 l6 8 6 -8z"/></g>
<g font-family="Vazirmatn,Tahoma,Arial,sans-serif" text-anchor="middle">
 <g><rect x="34" y="78" width="192" height="104" rx="16" fill="url(#card)" stroke="#8d8d95" stroke-opacity=".5"/><text x="130" y="109" fill="#f0f0f2" font-size="16" font-weight="700">GitHub</text><text x="130" y="135" fill="#aaaab2" font-size="12">کد و تست‌ها</text><text x="130" y="155" fill="#777780" font-size="11">شاخهٔ اصلی / PR</text></g>
 <g><rect x="258" y="78" width="192" height="104" rx="16" fill="url(#card)" stroke="#8d8d95" stroke-opacity=".5"/><text x="354" y="109" fill="#f0f0f2" font-size="16" font-weight="700">Dockerfile</text><text x="354" y="135" fill="#aaaab2" font-size="12">Python + Xray</text><text x="354" y="155" fill="#777780" font-size="11">لایه‌های قابل‌کش</text></g>
 <g><rect x="482" y="78" width="192" height="104" rx="16" fill="url(#card)" stroke="#bcbcc4" stroke-opacity=".78"/><text x="578" y="109" fill="#f0f0f2" font-size="16" font-weight="700">Railway</text><text x="578" y="135" fill="#aaaab2" font-size="12">اجرای کانتینر</text><text x="578" y="155" fill="#777780" font-size="11">health check / restart</text></g>
 <g><rect x="706" y="78" width="192" height="104" rx="16" fill="url(#card)" stroke="#8d8d95" stroke-opacity=".5"/><text x="802" y="109" fill="#f0f0f2" font-size="16" font-weight="700">Nginx · 8080</text><text x="802" y="135" fill="#aaaab2" font-size="12">ورودی HTTP/HTTPS</text><text x="802" y="155" fill="#777780" font-size="11">مسیریابی پروفایل‌ها</text></g>
 <g><rect x="930" y="78" width="236" height="104" rx="16" fill="url(#card)" stroke="#8d8d95" stroke-opacity=".5"/><text x="1048" y="109" fill="#f0f0f2" font-size="16" font-weight="700">FastAPI + Xray</text><text x="1048" y="135" fill="#aaaab2" font-size="12">پنل و موتور اتصال</text><text x="1048" y="155" fill="#777780" font-size="11">loopback + مسیر مستقیم اختیاری</text></g>
 <g><rect x="422" y="222" width="312" height="78" rx="14" fill="#111113" stroke="#aaaab2" stroke-opacity=".55"/><text x="578" y="249" fill="#ededf0" font-size="15" font-weight="700">Volume پایدار</text><text x="578" y="272" fill="#a0a0a8" font-size="12">SQLite · کلید نشست · لاگ و تنظیمات</text></g>
</g>
<text x="600" y="322" fill="#777780" font-family="Vazirmatn,Tahoma,Arial,sans-serif" font-size="11" text-anchor="middle">مسیر داده را کد شناسایی می‌کند؛ خود Volume باید یک‌بار به سرویس متصل شود.</text>
</svg>